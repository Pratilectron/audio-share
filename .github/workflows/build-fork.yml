name: Build fork binaries

on:
  workflow_dispatch:

jobs:
  build_server_mfc:
    name: Build server-mfc
    # windows-latest is Visual Studio 18. This project is the v143 toolset, and
    # that image does not ship MFC for it (MSB8041). windows-2022 matches v143.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: server-mfc
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
      # The image's vcpkg has no usable binary cache here; build from source.
      VCPKG_BINARY_SOURCES: clear
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # windows-latest has the v143 toolset but not the MFC libraries (MSB8041).
      - name: Install MFC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) { throw "Visual Studio C++ toolset not found" }
          Write-Host "Installing ATL/MFC into $installPath"
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $proc = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            "modify",
            "--installPath", $installPath,
            "--add", "Microsoft.VisualStudio.Component.VC.ATLMFC",
            "--quiet", "--norestart", "--nocache", "--wait"
          )
          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
            throw "vs_installer exited with $($proc.ExitCode)"
          }
          $mfc = Get-ChildItem "$installPath\VC\Tools\MSVC" -Recurse -Filter "afxwin.h" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $mfc) { throw "MFC headers were not found after installing ATLMFC" }
          Write-Host "MFC header: $($mfc.FullName)"

      # Use the vcpkg that ships with the runner: the pinned upstream commit is
      # old enough that its msys2 packages no longer exist on the mirrors.
      - run: vcpkg install asio protobuf spdlog[wchar] wil nlohmann-json

      - run: vcpkg integrate install

      - run: msbuild /m /p:Configuration=Release,Platform=x64

      - name: Checksum
        run: cd x64/Release/ && sha256sum *.exe | tee $(ls *.exe).sha256
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: server-mfc
          path: |
            server-mfc/x64/Release/*.exe
            server-mfc/x64/Release/*.sha256

  build_app:
    name: Build Android App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - run: chmod +x gradlew

      - run: ./gradlew :app:assembleRelease

      - name: Checksum
        run: cd app/build/outputs/apk/release/ && sha256sum *.apk | tee $(ls *.apk).sha256

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            android-app/app/build/outputs/apk/release/*.apk
            android-app/app/build/outputs/apk/release/*.sha256
